<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olafs Kraftplan</title>
<style>
/* Layout: iOS-Stil – Large Title, Segmented Control, Inset-Grouped-Listen, Tab Bar unten */
/* Farben: light-dark() folgt dem System; data-theme="light"/"dark" erzwingt ein Schema */
:root {
  color-scheme: light dark;
  --bg: light-dark(#F2F2F7, #000000); --card: light-dark(#FFFFFF, #1C1C1E); --fg: light-dark(#000000, #FFFFFF);
  --fg2: light-dark(rgba(60,60,67,.62), rgba(235,235,245,.62)); --fg3: light-dark(rgba(60,60,67,.32), rgba(235,235,245,.3));
  --sep: light-dark(rgba(60,60,67,.16), rgba(84,84,88,.55)); --fill: light-dark(rgba(118,118,128,.12), rgba(118,118,128,.24)); --fill2: light-dark(rgba(118,118,128,.2), rgba(118,118,128,.36));
  --accent: light-dark(#FF2D55, #FF375F); --accent-soft: light-dark(rgba(255,45,85,.12), rgba(255,55,95,.2)); --on-accent: #FFFFFF;
  --green: light-dark(#248A3D, #30D158); --green-bg: light-dark(#34C759, #30D158); --green-soft: light-dark(rgba(52,199,89,.15), rgba(48,209,88,.2));
  --orange: light-dark(#C93400, #FF9F0A); --orange-soft: light-dark(rgba(255,149,0,.16), rgba(255,159,10,.2));
  --bar: light-dark(rgba(249,249,249,.86), rgba(22,22,24,.86)); --seg-thumb: light-dark(#FFFFFF, #636366); --shadow: light-dark(0 1px 3px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.5));
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.3;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 8px calc((210px + env(safe-area-inset-bottom, 0px)) * var(--z, 1)); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
#app, .tabbar { zoom: var(--z, 1); }
.topline { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; min-height: 44px; }
.tools { display: flex; align-items: center; gap: 8px; }
.sizer { display: flex; background: var(--fill); border-radius: 999px; padding: 2px; }
.sizer button { width: 34px; height: 30px; border-radius: 999px; font-weight: 600; color: var(--accent); }
.sizer button:first-child { font-size: 13px; }
.sizer button:last-child { font-size: 18px; }
.sizer button:disabled { color: var(--fg3); cursor: default; }
.storage { font-size: 13px; color: var(--fg2); display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); flex: none; }
.dot.ok { background: var(--green-bg); }
.dot.warn { background: var(--orange); }
.datepick { font-size: 16px; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px;
  padding: 6px 12px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.largetitle { font-size: 34px; font-weight: 700; letter-spacing: .01em; margin: 6px 0 2px; text-wrap: balance; }
.subtitle { color: var(--fg2); font-size: 15px; margin: 0 0 14px; }

/* Segmented control */
.seg { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; margin-bottom: 8px; }
.seg button { height: 30px; border-radius: 7px; font-size: 13px; font-weight: 500; position: relative; }
.seg button.on { background: var(--seg-thumb); box-shadow: var(--shadow); font-weight: 600; }
.seg button.today::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
.seg button.done::before { content: ""; position: absolute; top: 4px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--green-bg); }
.weekline { font-size: 13px; color: var(--fg2); margin: 0 4px 20px; }

/* Gruppen */
.group-h { font-size: 13px; color: var(--fg2); text-transform: uppercase; letter-spacing: .03em; margin: 0 16px 7px; display: flex; justify-content: space-between; gap: 8px; }
.card { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 28px; }
.ex-head { padding: 14px 16px 10px; display: grid; gap: 6px; }
.ex-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.ex-name { font-size: 17px; font-weight: 600; min-width: 0; }
.ex-target { font-size: 15px; color: var(--fg2); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--fill); color: var(--fg2); }
.chip.ss { background: var(--accent-soft); color: var(--accent); }
.chip.up { background: var(--green-soft); color: var(--green); }
.chip.hold { background: var(--orange-soft); color: var(--orange); }
.tip { font-size: 13px; color: var(--fg2); line-height: 1.35; }
.last { font-size: 13px; color: var(--fg2); }
.last b { color: var(--fg); font-weight: 600; }

.sets { border-top: .5px solid var(--sep); }
.row { display: grid; grid-template-columns: 44px 1fr 1fr 44px; align-items: center; gap: 10px; padding: 6px 12px 6px 16px; }
.row + .row { border-top: .5px solid var(--sep); margin-left: 16px; padding-left: 0; }
.row.lbl { padding-top: 8px; padding-bottom: 2px; font-size: 11px; font-weight: 600; color: var(--fg2); letter-spacing: .04em; text-transform: uppercase; }
.row.lbl + .row { border-top: 0; margin-left: 0; padding-left: 16px; }
.setno { font-size: 15px; color: var(--fg2); font-weight: 600; }
.num { width: 100%; min-width: 0; height: 44px; border: 0; border-radius: 8px; background: var(--fill); color: var(--fg);
  font: 600 17px var(--font); text-align: center; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.num::placeholder { color: var(--fg3); font-weight: 500; }
.num:disabled { background: transparent; }
.num.sm { width: 88px; height: 36px; font-size: 16px; }
.check { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--fg3); display: grid; place-items: center; justify-self: end; transition: background .15s, border-color .15s; }
.check svg { width: 18px; height: 18px; opacity: 0; }
.check.done { background: var(--green-bg); border-color: var(--green-bg); }
.check.done svg { opacity: 1; }
.row.isdone .num { color: var(--green); }

.note { display: block; width: 100%; min-height: 64px; border: 0; border-radius: 12px; background: var(--card); color: var(--fg);
  font: 16px/1.35 var(--font); padding: 12px 14px; resize: vertical; margin-bottom: 20px; }
.note::placeholder { color: var(--fg3); }
.savebar { display: grid; gap: 8px; margin-top: -6px; }
.btn { height: 50px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 600; }
.btn:active { opacity: .8; }
.btn:disabled { opacity: .55; cursor: default; }
.hint { font-size: 13px; color: var(--fg2); text-align: center; }
.notice { background: var(--orange-soft); border-radius: 12px; padding: 12px 14px; margin: -8px 0 24px; font-size: 15px; line-height: 1.4; display: grid; gap: 8px; }
.notice b { color: var(--orange); }
.notice.soft { background: var(--fill); }
.pill { justify-self: start; min-height: 34px; padding: 0 14px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 15px; font-weight: 600; white-space: nowrap; }
.pill:disabled { opacity: .45; cursor: default; }

/* Verlauf */
.li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 11px 16px; width: 100%; text-align: left; }
.li + .li, .li + .detail, .detail + .li { border-top: .5px solid var(--sep); }
.li-main { min-width: 0; }
.li-title { font-size: 17px; }
.li-sub { font-size: 13px; color: var(--fg2); margin-top: 2px; overflow-wrap: anywhere; }
.li-right { display: flex; align-items: center; gap: 8px; color: var(--fg3); }
.chev { width: 8px; height: 13px; transition: transform .2s; }
.open .chev { transform: rotate(90deg); }
.spark { width: 72px; height: 28px; display: block; }
.detail { padding: 4px 16px 12px; display: grid; gap: 0; }
.drow { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; padding: 7px 0; }
.drow + .drow { border-top: .5px solid var(--sep); }
.drow span:first-child { color: var(--fg2); white-space: nowrap; }
.drow span:last-child { text-align: right; overflow-wrap: anywhere; }
.del { font-size: 15px; color: var(--accent); padding: 6px 2px; white-space: nowrap; }
.del.confirm { color: var(--on-accent); background: var(--accent); border-radius: 8px; padding: 6px 10px; }
.empty { padding: 24px 20px; text-align: center; color: var(--fg2); font-size: 15px; line-height: 1.45; }
.empty strong { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }

/* Pausen-Timer */
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc((66px + env(safe-area-inset-bottom, 0px)) * var(--z, 1));
  width: min(calc(520px * var(--z, 1)), calc(100% - 24px)); background: var(--card); border-radius: calc(20px * var(--z, 1)); box-shadow: 0 8px 30px rgba(0,0,0,.22);
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: calc(10px * var(--z, 1));
  padding: calc(14px * var(--z, 1)) calc(14px * var(--z, 1)) calc(16px * var(--z, 1)) calc(20px * var(--z, 1)); z-index: 20; overflow: hidden; }
.timer[hidden] { display: none; }
.timer .tl { font-size: calc(15px * var(--z, 1)); color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer .tv { font-size: calc(48px * var(--z, 1)); line-height: 1.05; font-weight: 700; letter-spacing: .01em; }
.timer.fin .tv { color: var(--green); }
.tbtn { height: calc(48px * var(--z, 1)); padding: 0 calc(16px * var(--z, 1)); border-radius: 999px; background: var(--fill); font-size: calc(17px * var(--z, 1)); font-weight: 600; white-space: nowrap; }
.tbar { position: absolute; left: 0; bottom: 0; height: calc(5px * var(--z, 1)); background: var(--accent); }
.timer.hard .tv { color: var(--orange); }
.timer.hard .tbar { background: var(--orange); }

/* Tab Bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--sep); display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 30; }
.tab { display: grid; justify-items: center; gap: 2px; font-size: 10px; font-weight: 500; color: var(--fg2); padding: 2px 0; }
.tab svg { width: 26px; height: 26px; }
.tab.on { color: var(--accent); }

.toast { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--card); color: var(--fg);
  box-shadow: 0 6px 24px rgba(0,0,0,.18); border-radius: 18px; padding: 10px 18px; font-size: 15px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
.toast[hidden] { display: none; }
.statbtn { width: 40px; height: 36px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }

/* Blätter (Statistik, Einstellungen) */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
.modal[hidden] { display: none; }
.msheet { background: var(--bg); color: var(--fg); width: 100%; max-width: 640px; max-height: 92%; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
.mhead { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; }
.mhead h2 { font-size: 22px; font-weight: 700; }
.mclose { width: 34px; height: 34px; border-radius: 999px; background: var(--fill); font-size: 16px; font-weight: 600; color: var(--fg2); }
.mbody { overflow-y: auto; padding: 0 16px 20px; -webkit-overflow-scrolling: touch; }
.mnote { font-size: 13px; color: var(--fg2); padding: 0 4px 6px; line-height: 1.4; }
.sday { font-size: 13px; font-weight: 600; color: var(--fg2); text-transform: uppercase; letter-spacing: .04em; margin: 16px 4px 8px; }
.scard { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.shead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sname { font-weight: 600; font-size: 16px; }
.sval { font-size: 14px; color: var(--fg2); white-space: nowrap; }
.sval b { color: var(--fg); font-size: 17px; }
.sdelta { font-weight: 700; }
.sdelta.up { color: var(--green); }
.sdelta.down { color: var(--accent); }
.sempty { font-size: 14px; color: var(--fg3); margin-top: 4px; }
.plateau { margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--orange); background: var(--orange-soft); border-radius: 8px; padding: 6px 10px; }
.srow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 15px; padding: 8px 0 0; }
.srow + .srow { border-top: .5px solid var(--sep); margin-top: 8px; }
.sdim { color: var(--fg3); font-size: 13px; }
.chip.jump { background: var(--fill); color: var(--fg2); padding: 7px 12px; font-size: 13px; }
.chip.jump.on { background: var(--accent-soft); color: var(--accent); }
.stiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 12px; }
.stile { background: var(--card); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.stile b { font-size: 30px; font-weight: 700; line-height: 1.1; }
.stile span { font-size: 14px; font-weight: 600; }
.stile small { font-size: 12px; color: var(--fg3); }
.frow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; font-size: 15px; min-height: 44px; }
.frow + .frow { border-top: .5px solid var(--sep); }
.fin { display: flex; align-items: center; gap: 6px; color: var(--fg2); flex: none; }
.fsel { height: 36px; border: 0; border-radius: 8px; background: var(--fill); color: var(--fg); font: 600 16px var(--font); padding: 0 8px; }
.tog { width: 22px; height: 22px; accent-color: var(--accent); }
.scard .note { background: var(--fill); margin: 8px 0; min-height: 80px; font-size: 14px; }
/* Cardio */
.meter { height: 10px; border-radius: 999px; background: var(--fill); overflow: hidden; }
.meter div { height: 100%; background: var(--accent); border-radius: 999px; }
.meter.full div { background: var(--green-bg); }
.card .note { background: var(--fill); margin: 4px 0 0; }
.schart { width: 100%; height: auto; display: block; margin-top: 4px; }
.sx { font-size: 10px; fill: var(--fg2); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* Kein versehentliches Markieren (Google-Suchleiste) beim Tippen; Eingabefelder bleiben normal */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
button, input, textarea, select { touch-action: manipulation; }
/* Timer fängt keine Tipps ab (nur seine Buttons) und verschwindet beim Tippen in ein Feld */
.timer { pointer-events: none; }
.timer button { pointer-events: auto; }
body.typing .timer { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" id="app"></div>

<div class="timer" id="timer" hidden>
  <div><div class="tl" id="timerLabel">Pause</div><div class="tv" id="timerVal">0:00</div></div>
  <button class="tbtn" id="timerPlus" type="button">+15 s</button>
  <button class="tbtn" id="timerStop" type="button">Fertig</button>
  <div class="tbar" id="timerBar"></div>
</div>

<nav class="tabbar" aria-label="Bereiche">
  <button class="tab on" id="tabTrain" type="button">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11v6M24 11v6M7.5 8v12M20.5 8v12M7.5 14h13"/></svg>
    Training
  </button>
  <button class="tab" id="tabCardio" type="button">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 23s-9-5.4-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.6-9 12-9 12z"/><path d="M5.5 14h4l2-3 3 6 2-3h6"/></svg>
    Cardio
  </button>
  <button class="tab" id="tabHist" type="button">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h20"/><path d="M5 18l5.5-6 4.5 3.5L23 7"/><path d="M18 7h5v5"/></svg>
    Verlauf
  </button>
</nav>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="statsModal" hidden><div class="msheet" role="dialog" aria-label="Statistik"><div class="mhead"><h2>Statistik</h2><button type="button" class="mclose" data-close aria-label="Schließen">✕</button></div><div class="mbody" id="statsBody"></div></div></div>
<div class="modal" id="setModal" hidden><div class="msheet" role="dialog" aria-label="Einstellungen"><div class="mhead"><h2>Einstellungen</h2><button type="button" class="mclose" data-close aria-label="Schließen">✕</button></div><div class="mbody" id="setBody"></div></div></div>

<script>
// ---------- Plan ----------
// unit: "kg" Gewicht, "kg+" Zusatzgewicht, "cm" Fußhöhe, null = nur Wiederholungen
const PLAN = {
  mo: { name: "Montag", focus: "Power & Beine", ex: [
    { id: "powerclean", bar: 20, name: "Power Cleans", sets: 3, min: 3, max: 3, rest: 120, unit: "kg", step: 2.5 },
    { id: "suitcase", name: "Einarmiger Farmer's Walk (Suitcase Carry)", sets: 2, min: 30, max: 40, rest: 45, unit: "kg", step: 2, repUnit: "s", tip: "Aufrecht gehen, nicht zur Seite lehnen. Zeit pro Seite, Gewicht so wählen, dass 30–40 s sauber gehen." } ]},
  di: { name: "Dienstag", focus: "Push & Trizeps", ex: [
    { id: "dbpress1", name: "Einarmiges KH-Drücken (halbknien)", sets: 3, min: 8, max: 12, rest: 60, unit: "kg", step: 2, start: 16, tip: "Halbknien (ein Knie am Boden, Becken aufrecht), Hantel auf Schulterhöhe, gerade nach oben drücken, Rippen unten lassen, kein Hohlkreuz. Wiederholungen pro Seite." },
    { id: "ohtriceps", name: "Überkopf-Trizepsdrücken (1 KH)", sets: 3, min: 10, max: 12, rest: 60, unit: "kg", step: 2 } ]},
  mi: { name: "Mittwoch", focus: "Pull & Bizeps", ex: [
    { id: "chinups", bw: "pull", assist: true, name: "Klimmzüge neutral (Ringe)", sets: 3, min: 8, max: 12, rest: 90, unit: "kg+", step: 2.5, tip: "Neutraler Griff, Handflächen zueinander. Mit Absprung hochkommen, oben kurz halten, langsam ablassen." },
    { id: "inclinecurl", name: "Schrägbank-Curls", sets: 2, min: 10, max: 12, rest: 60, unit: "kg", step: 1, tip: "Hände beim Hochgehen nach außen ausdrehen (Supination)." },
    { id: "pallof", bandOnly: true, name: "Pallof Press (Band)", sets: 2, min: 10, max: 12, rest: 30, unit: null, step: 0, tip: "Seitlich zum Band stehen, mit beiden Händen vor der Brust nach vorn drücken, 2 Sek. halten, der Körper darf sich nicht drehen. Wiederholungen pro Seite. Wenn 12 leicht gehen: stärkeres Band oder mehr Abstand zur Befestigung." } ]},
  do: { name: "Donnerstag", focus: "Beine & Core", ex: [
    { id: "frontsquat", bar: 20, name: "Front Squats", sets: 3, min: 5, max: 5, rest: 90, unit: "kg", step: 2.5 },
    { id: "kneeelbow", name: "Knee to Elbow (hängend)", sets: 2, min: 8, max: 12, rest: 60, unit: null, step: 0, tip: "Hängend, Knie kontrolliert zu den Ellbogen ziehen, ohne Schwung. Wenn 12 leicht gehen: langsamer oder Beine gestreckter." } ]},
  fr: { name: "Freitag", focus: "Quick-Push & Pull · unter 8 Min.", ex: [
    { id: "bbrow", bar: 20, name: "Langhantel-Rudern", sets: 3, min: 6, max: 8, rest: 45, unit: "kg", step: 2.5, ss: "Supersatz A1" },
    { id: "declinepushup", bw: "push", tempo: true, name: "Liegestütz mit Griffen, Füße erhöht", sets: 3, min: 6, max: 10, rest: 45, unit: "cm", step: 10, ss: "Supersatz A2",
      tip: "Füße auf Bank/Box (Start ca. 40 cm), neutraler Griff, Ellbogen 30–45° am Körper. 3 Sek. runter, 1–2 Sek. unten halten, kontrolliert hoch. Tiefe schrittweise steigern, ohne Ziehen vorn an der Schulter. Wenn zu leicht: langsamer oder Füße höher." } ]},
  sa: { name: "Samstag", focus: "Arm-Dicke & Schultern", ex: [
    { id: "hammercurl", name: "KH-Hammer-Curls", sets: 3, min: 10, max: 12, rest: 60, unit: "kg", step: 1, tip: "Hände durchgehend neutral (quer) halten." },

  const l = pts.slice(-3);
  const volFlat = l[0].pv > 0 && Math.max(l[1].pv, l[2].pv) <= l[0].pv * 1.02;
  const pe = pts.filter(q => q.e != null).slice(-3);
  const eFlat = pe.length < 3 || Math.max(pe[1].e, pe[2].e) <= pe[0].e * 1.02;
  return volFlat && eFlat;
}
const plateauHtml = () => '<div class="plateau">⚠ Plateau: seit 3 Einheiten kein Fortschritt bei Volumen und Kraft</div>';
// Neue Bestwerte einer (noch nicht gespeicherten) Einheit gegenüber allen anderen
function newRecords(doc) {
  const out = [], others = state.sessions.filter(s => s.id !== doc.id);
  for (const ex of PLAN[doc.day] ? PLAN[doc.day].ex : []) {
    if (!doc.entries[ex.id]) continue;
    const st = statSeries(ex, [doc, ...others]);
    const now = st.pts.find(p => p.id === doc.id), before = st.pts.filter(p => p.id !== doc.id);
    if (!now || !before.length) continue;
    const maxE = Math.max(0, ...before.map(p => p.e || 0)), maxV = Math.max(0, ...before.map(p => p.v));
    if (now.e && maxE && now.e > maxE + 0.05) out.push({ name: shortName(ex), what: `Kraft ${fmt(now.e, 1)} kg` });
    else if (maxV && now.v > maxV) out.push({ name: shortName(ex), what: st.tut ? "Zeit" : st.useVol ? "Volumen" : "Wdh." });
  }
  return out;
}
// Deload: nach DELOAD_WEEKS Trainingswochen am Stück (ohne Pause/Deload) oder bei vielen Plateaus
function deloadInfo() {
  const ws = weekStart(today);
  if (settings.deloads.includes(ws)) return { active: true };
  const weeks = new Set(state.sessions.map(s => weekStart(s.date)));
  let n = 0;
  for (let w = addDays(ws, -7); weeks.has(w) && !settings.deloads.includes(w); w = addDays(w, -7)) n++;
  const plateaus = ALL_EX.filter(ex => plateau(ex)).length;
  return { active: false, weeks: n, plateaus, due: n >= DELOAD_WEEKS || plateaus >= DELOAD_PLATEAUS };
}

function spark(ex) {

  if (pts.length < 2) return "";
  const vals = pts.every(p => p.e != null) ? pts.map(p => p.e) : pts.map(p => p.v);
  const W = 72, H = 28, p = 3, lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;

  const line = xy.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");
  const area = line + ` L${xy[xy.length - 1][0].toFixed(1)} ${H} L${xy[0][0].toFixed(1)} ${H} Z`;
  const e = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${area}" fill="var(--accent-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${e[0]}" cy="${e[1]}" r="2.6" fill="var(--accent)"/></svg>`;
}

async function saveCardio() {

  const hr = Math.round(num(cd.hr) || 0); if (hr >= 40 && hr <= 230) doc.hr = hr;
  if (cd.note && cd.note.trim()) doc.note = cd.note.trim();

    const where = await writeSession(doc);
    state.cardioDraft = { kind: cd.kind, mode: "easy", min: null, hr: null, note: "" }; saveCardioDraft();

}

function finishIntervals() {

function deltas(pts, key) {

  const pw = addDays(weekStart(last.date), -7), prev = q.filter(p => weekStart(p.date) === pw).pop();
  return { last, total: q.length > 1 ? pct(last[key], q[0][key]) : null, week: prev ? pct(last[key], prev[key]) : null, n: q.length };
}

// Band-Faktor aus zwei Sätzen bis kurz vor Versagen: gleiche Maximalkraft (Epley) ohne und mit Band
function calcBandFactor(bw, r0, r1, bandKg) {
  if (!(bw > 0 && r0 > 0 && r1 > 0 && bandKg > 0)) return null;
  const load = bw * (1 + r0 / 30) / (1 + r1 / 30);   // Last, die mit Band bewegt wurde
  return (bw - load) / bandKg;
}

const exportDoc = (s) => ({ id: s.id, date: s.date, day: s.day, entries: s.entries, savedAt: s.savedAt, ...(s.bw != null ? { bw: s.bw } : {}), ...(s.note ? { note: s.note } : {}) });
const cardioDoc = (c) => ({ id: c.id, date: c.id.slice(7, 17), kind: CARDIO_KINDS.includes(c.kind) ? c.kind : "Sonstiges", min: Math.round(+c.min), mode: c.mode === "intervals" ? "intervals" : "easy", savedAt: c.savedAt || new Date().toISOString(), ...(+c.hr > 0 ? { hr: Math.round(+c.hr) } : {}), ...(c.note ? { note: String(c.note) } : {}) });
const exportJson = () => JSON.stringify({ app: "kraftplan", version: 1, exportedAt: new Date().toISOString(), settings, sessions: state.sessions.map(exportDoc), cardio: state.cardio.map(cardioDoc) }, null, 1);
// Akzeptiert den App-Export ({sessions:[…]}) oder eine reine Liste wie data/sessions-export.json
function parseImport(text) {
  const j = JSON.parse(text);
  const arr = Array.isArray(j) ? j : j && Array.isArray(j.sessions) ? j.sessions : [];
  const carr = j && !Array.isArray(j) && Array.isArray(j.cardio) ? j.cardio : [];
  if (!arr.length && !carr.length) throw new Error("Keine Einheiten gefunden");
  const docs = arr.filter(d => d && typeof d.id === "string" && ID_RE.test(d.id) && d.entries && typeof d.entries === "object" && !Array.isArray(d.entries))
    .map(d => exportDoc({ ...d, date: d.id.slice(0, 10), day: dayOfKey(d.id), savedAt: d.savedAt || new Date().toISOString() }));
  const plan = { add: [], change: [], same: 0, skipped: arr.length - docs.length };
  for (const d of docs) {
    const cur = savedSession(d.id);
    if (!cur) plan.add.push(d);
    else if (normEntries(cur.entries) !== normEntries(d.entries) || (cur.note || "") !== (d.note || "")) plan.change.push(d);
    else plan.same++;
  }
  for (const c of carr.filter(c => c && typeof c.id === "string" && CARDIO_RE.test(c.id) && +c.min > 0).map(cardioDoc)) {
    const cur = state.cardio.find(x => x.id === c.id);
    if (!cur) plan.add.push(c);
    else if (JSON.stringify({ ...cardioDoc(cur), savedAt: 0 }) !== JSON.stringify({ ...c, savedAt: 0 })) plan.change.push(c);
    else plan.same++;
  }
  return plan;
}

  if (dl) {

    catch (e) { if (e && e.code === "declined") return; }
  }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { toast("Download nicht möglich – nutze „Kopieren“", 4000); }
}

async function runImport() {

    try { state.importPlan = parseImport($("#impText").value); }
    catch (e) { $("#impInfo").textContent = "Kein gültiges JSON: " + errText(e); return; }
    const p = state.importPlan, n = p.add.length + p.change.length;
    $("#impInfo").textContent = `${p.add.length} neu, ${p.change.length} abweichend (werden überschrieben), ${p.same} unverändert${p.skipped ? `, ${p.skipped} ungültig` : ""}`;
    $("#impRun").textContent = n ? `${n} übernehmen` : "Prüfen"; if (!n) state.importPlan = null;
    return;
  }
  const docs = [...state.importPlan.add, ...state.importPlan.change]; state.importPlan = null;
  $("#impRun").disabled = true; let ok = 0;
  try { for (const d of docs) { await writeSession(d); ok++; $("#impInfo").textContent = `${ok} von ${docs.length} übertragen …`; } }
  catch (e) { toast("Import abgebrochen: " + errText(e), 5000); }
  $("#impRun").disabled = false; $("#impRun").textContent = "Prüfen";
  $("#impInfo").textContent = `${ok} von ${docs.length} Einheiten importiert`;
  cleanDrafts(); render();
}
$("#setModal").addEventListener("input", (e) => {
  if (["calR0", "calR1", "calBand", "setBw"].includes(e.target.id) || /^setBand/.test(e.target.id)) updateCalc();
  if (e.target.id === "impText" && state.importPlan) { state.importPlan = null; $("#impRun").textContent = "Prüfen"; }
});
$("#setModal").addEventListener("change", (e) => {
  if (e.target.id === "calBand") updateCalc();
  if (e.target.id === "impFile" && e.target.files && e.target.files[0]) {
    e.target.files[0].text().then(t => { $("#impText").value = t; state.importPlan = null; runImport(); }, () => toast("Datei nicht lesbar"));
  }
});
$("#setModal").addEventListener("click", async (e) => {
  const b = e.target.closest && e.target.closest("button"); if (!b) return;
  if (b.id === "calApply" && state.calF != null) { $("#setBf").value = fmt(state.calF); toast("Faktor eingetragen – noch „Einstellungen speichern“ tippen", 3500); return; }
  if (b.id === "setSave") {
    try { await storeSettings(readSettingsForm()); toast("✓ Einstellungen gespeichert"); renderSettings(); render(); }
    catch (err) { toast("Speichern fehlgeschlagen: " + errText(err), 4000); }
    return;
  }
  if (b.id === "expSave") { downloadExport(); return; }
  if (b.id === "expCopy") { copyExport(); return; }
  if (b.id === "impRun") { runImport(); return; }
});

// ---------- Blätter (Statistik, Einstellungen) ----------
const SHEETS = { stats: ["#statsModal", renderStats], settings: ["#setModal", renderSettings] };
function openSheet(name) { if (state.sheet) closeSheet(); state.sheet = name; SHEETS[name][1](); $(SHEETS[name][0]).hidden = false; document.body.style.overflow = "hidden"; }
function closeSheet() { if (!state.sheet) return; $(SHEETS[state.sheet][0]).hidden = true; state.sheet = null; document.body.style.overflow = ""; }
for (const [sel] of Object.values(SHEETS)) $(sel).addEventListener("click", (e) => { if (e.target === e.currentTarget || (e.target.closest && e.target.closest("[data-close]"))) closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

// ---------- Größe (App-Zoom statt Browser-Zoom) ----------
const ZOOMS = [0.9, 1, 1.15, 1.3, 1.5, 1.75, 2];
let zoomIdx = (() => { const s = lsGet("kraftplan-zoom", null); if (s != null && ZOOMS[s] != null) return s; return window.innerWidth >= 900 ? 3 : 1; })();
function applyZoom() { document.documentElement.style.setProperty("--z", ZOOMS[zoomIdx]); }
function setZoom(i) { zoomIdx = Math.max(0, Math.min(ZOOMS.length - 1, i)); lsSet("kraftplan-zoom", zoomIdx); applyZoom(); render(); }
applyZoom();

// ---------- Timer bleibt auch beim Reinzoomen (Pinch) sichtbar ----------
function placeTimer() {
  const t = $("#timer"), vv = window.visualViewport;
  if (t.hidden || !vv || Math.abs(vv.scale - 1) < 0.02) { t.style.left = t.style.top = t.style.bottom = t.style.transform = t.style.transformOrigin = ""; return; }
  const s = 1 / vv.scale;
  t.style.transformOrigin = "0 0";
  t.style.left = (vv.offsetLeft + vv.width / 2) + "px";
  t.style.top = (vv.offsetTop + vv.height - 12 * s) + "px";
  t.style.bottom = "auto";
  t.style.transform = `scale(${s}) translate(-50%, -100%)`;
}
if (window.visualViewport) { visualViewport.addEventListener("resize", placeTimer); visualViewport.addEventListener("scroll", placeTimer); }

// ---------- Timer: Ton, Vibration, Bildschirm anlassen ----------
let tEnd = 0, tTotal = 0, tInt = null, tHide = null, tLabel = "", actx = null, wake = null, wakeT = null;
let seq = null;   // laufende Intervall-Folge {phases:[{sec,label,hard}], i}
function primeAudio() {   // muss aus einem Tipp heraus passieren, sonst bleibt der Ton stumm
  if (!settings.sound) return;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (_) { actx = null; }
}
function beep(n = 3) {
  if (!settings.sound || !actx) return;
  try {
    const t0 = actx.currentTime;
    [0, 0.25, 0.5].slice(0, n).forEach((d, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = i === 2 || n === 1 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.3, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.18);
      o.connect(g); g.connect(actx.destination); o.start(t0 + d); o.stop(t0 + d + 0.2);
    });
  } catch (_) {}
}
async function keepAwake(on) {
  clearTimeout(wakeT);
  try {
    if (on && settings.wakeLock && !wake && typeof navigator !== "undefined" && navigator.wakeLock && document.visibilityState === "visible") {
      wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; });
    } else if (!on && wake) { const w = wake; wake = null; await w.release(); }
  } catch (_) { wake = null; }
}
// raw: Beschriftung ohne „Pause ·“ (Intervall-Phasen); ein normaler Pausen-Timer beendet laufende Intervalle
function startTimer(sec, label, raw) {
  if (!raw) { seq = null; $("#timer").classList.remove("hard"); }
  clearTimeout(tHide); tTotal = sec; tEnd = Date.now() + sec * 1000; tLabel = label;
  primeAudio(); keepAwake(true);
  $("#timerLabel").textContent = raw ? label : "Pause · " + label; $("#timer").classList.remove("fin"); $("#timer").hidden = false; placeTimer();
  clearInterval(tInt); tInt = setInterval(tick, 250); tick();
}
function tick() {
  const left = Math.max(0, Math.ceil((tEnd - Date.now()) / 1000));
  $("#timerVal").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  $("#timerBar").style.width = (100 * left / tTotal) + "%";
  if (left === 0 && seq && seq.i < seq.phases.length - 1) {   // nächste Intervall-Phase
    beep(1); try { navigator.vibrate && navigator.vibrate(300); } catch (_) {}
    seq.i++; runPhase(); return;
  }
  if (left === 0) {
    clearInterval(tInt); beep();
    if (seq) { $("#timer").classList.remove("hard"); finishIntervals(); }
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (_) {}
    $("#timer").classList.add("fin"); $("#timerVal").textContent = "Weiter!";
    tHide = setTimeout(() => $("#timer").hidden = true, 4000);
    wakeT = setTimeout(() => keepAwake(false), 5 * 60000);   // Bildschirm bis 5 Min. nach der Pause anlassen
  }
}
$("#timerPlus").addEventListener("click", () => { if ($("#timer").classList.contains("fin")) return startTimer(15, tLabel); tEnd += 15000; tTotal += 15; tick(); });
$("#timerStop").addEventListener("click", () => { clearInterval(tInt); clearTimeout(tHide); tEnd = 0; $("#timer").hidden = true; if (seq) { seq = null; $("#timer").classList.remove("hard"); softRender(); } });

let toastT = null;
function toast(msg, ms) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms || 2200); }

window.addEventListener("error", (e) => { try { toast("Fehler: " + (e.message || "unbekannt"), 5000); } catch (_) {} });
window.addEventListener("unhandledrejection", (e) => { try { toast("Fehler: " + errText(e.reason), 5000); } catch (_) {} });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (tEnd > Date.now()) keepAwake(true);   // Wake Lock geht beim Wegschalten verloren
  const t = isoToday(); if (t === today) return;
  today = t;                                 // neuer Tag: "heute" immer aktualisieren …
  if (!unsavedChanges()) { state.date = t; state.day = dayFromDate(t); }   // … zum heutigen Training aber nur ohne offene Eingaben
  softRender();
});

document.addEventListener("focusin", () => { if (isEditing()) document.body.classList.add("typing"); });
document.addEventListener("focusout", () => setTimeout(() => { if (!isEditing()) document.body.classList.remove("typing"); }, 300));

render();
initStore();
</script>
