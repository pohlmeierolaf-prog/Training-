<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olafs Kraftplan</title>
<style>
/* Layout: iOS-Stil – Large Title, Segmented Control, Inset-Grouped-Listen, Tab Bar unten */
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --fg: #000000; --fg2: rgba(60,60,67,.62); --fg3: rgba(60,60,67,.32);
  --sep: rgba(60,60,67,.16); --fill: rgba(118,118,128,.12); --fill2: rgba(118,118,128,.2);
  --accent: #FF2D55; --accent-soft: rgba(255,45,85,.12); --on-accent: #FFFFFF;
  --green: #248A3D; --green-bg: #34C759; --green-soft: rgba(52,199,89,.15);
  --orange: #C93400; --orange-soft: rgba(255,149,0,.16);
  --bar: rgba(249,249,249,.86); --seg-thumb: #FFFFFF; --shadow: 0 1px 3px rgba(0,0,0,.12);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --card: #1C1C1E; --fg: #FFFFFF; --fg2: rgba(235,235,245,.62); --fg3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36);
  --accent: #FF375F; --accent-soft: rgba(255,55,95,.2); --on-accent: #FFFFFF;
  --green: #30D158; --green-bg: #30D158; --green-soft: rgba(48,209,88,.2);
  --orange: #FF9F0A; --orange-soft: rgba(255,159,10,.2);
  --bar: rgba(22,22,24,.86); --seg-thumb: #636366; --shadow: 0 1px 3px rgba(0,0,0,.5);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --fg: #FFFFFF; --fg2: rgba(235,235,245,.62); --fg3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36);
  --accent: #FF375F; --accent-soft: rgba(255,55,95,.2); --on-accent: #FFFFFF;
  --green: #30D158; --green-bg: #30D158; --green-soft: rgba(48,209,88,.2);
  --orange: #FF9F0A; --orange-soft: rgba(255,159,10,.2);
  --bar: rgba(22,22,24,.86); --seg-thumb: #636366; --shadow: 0 1px 3px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.3;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 8px calc((210px + env(safe-area-inset-bottom, 0px)) * var(--z, 1)); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
#app, .tabbar { zoom: var(--z, 1); }
.topline { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; min-height: 44px; }
.tools { display: flex; align-items: center; gap: 8px; }
.sizer { display: flex; background: var(--fill); border-radius: 999px; padding: 2px; }
.sizer button { width: 34px; height: 30px; border-radius: 999px; font-weight: 600; color: var(--accent); }
.sizer button:first-child { font-size: 13px; }
.sizer button:last-child { font-size: 18px; }
.sizer button:disabled { color: var(--fg3); cursor: default; }
.storage { font-size: 13px; color: var(--fg2); display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); }
.dot.ok { background: var(--green-bg); }
.datepick { font-size: 16px; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px;
  padding: 6px 12px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.largetitle { font-size: 34px; font-weight: 700; letter-spacing: .01em; margin: 6px 0 2px; text-wrap: balance; }
.subtitle { color: var(--fg2); font-size: 15px; margin: 0 0 14px; }

/* Segmented control */
.seg { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; margin-bottom: 22px; }
.seg button { height: 30px; border-radius: 7px; font-size: 13px; font-weight: 500; position: relative; }
.seg button.on { background: var(--seg-thumb); box-shadow: var(--shadow); font-weight: 600; }
.seg button.today::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }

/* Gruppen */
.group-h { font-size: 13px; color: var(--fg2); text-transform: uppercase; letter-spacing: .03em; margin: 0 16px 7px; display: flex; justify-content: space-between; gap: 8px; }
.card { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 28px; }
.ex-head { padding: 14px 16px 10px; display: grid; gap: 6px; }
.ex-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.ex-name { font-size: 17px; font-weight: 600; min-width: 0; }
.ex-target { font-size: 15px; color: var(--fg2); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--fill); color: var(--fg2); }
.chip.ss { background: var(--accent-soft); color: var(--accent); }
.chip.up { background: var(--green-soft); color: var(--green); }
.chip.hold { background: var(--orange-soft); color: var(--orange); }
.tip { font-size: 13px; color: var(--fg2); line-height: 1.35; }
.last { font-size: 13px; color: var(--fg2); }
.last b { color: var(--fg); font-weight: 600; }

.sets { border-top: .5px solid var(--sep); }
.row { display: grid; grid-template-columns: 44px 1fr 1fr 44px; align-items: center; gap: 10px; padding: 6px 12px 6px 16px; }
.row + .row { border-top: .5px solid var(--sep); margin-left: 16px; padding-left: 0; grid-template-columns: 44px 1fr 1fr 44px; }
.row.lbl { padding-top: 8px; padding-bottom: 2px; font-size: 11px; font-weight: 600; color: var(--fg2); letter-spacing: .04em; text-transform: uppercase; }
.row.lbl + .row { border-top: 0; margin-left: 0; padding-left: 16px; }
.setno { font-size: 15px; color: var(--fg2); font-weight: 600; }
.num { width: 100%; min-width: 0; height: 44px; border: 0; border-radius: 8px; background: var(--fill); color: var(--fg);
  font: 600 17px var(--font); text-align: center; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.num::placeholder { color: var(--fg3); font-weight: 500; }
.num:disabled { background: transparent; }
.check { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--fg3); display: grid; place-items: center; justify-self: end; transition: background .15s, border-color .15s; }
.check svg { width: 18px; height: 18px; opacity: 0; }
.check.done { background: var(--green-bg); border-color: var(--green-bg); }
.check.done svg { opacity: 1; }
.row.isdone .num { color: var(--green); }

.savebar { display: grid; gap: 8px; margin-top: -6px; }
.btn { height: 50px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 600; }
.btn:active { opacity: .8; }
.hint { font-size: 13px; color: var(--fg2); text-align: center; }

/* Verlauf */
.li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 11px 16px; width: 100%; text-align: left; }
.li + .li, .li + .detail, .detail + .li { border-top: .5px solid var(--sep); }
.li-main { min-width: 0; }
.li-title { font-size: 17px; }
.li-sub { font-size: 13px; color: var(--fg2); margin-top: 2px; overflow-wrap: anywhere; }
.li-right { display: flex; align-items: center; gap: 8px; color: var(--fg3); }
.chev { width: 8px; height: 13px; transition: transform .2s; }
.open .chev { transform: rotate(90deg); }
.spark { width: 72px; height: 28px; display: block; }
.detail { padding: 4px 16px 12px; display: grid; gap: 0; }
.drow { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; padding: 7px 0; }
.drow + .drow { border-top: .5px solid var(--sep); }
.drow span:first-child { color: var(--fg2); white-space: nowrap; }
.drow span:last-child { text-align: right; overflow-wrap: anywhere; }
.del { font-size: 15px; color: var(--accent); padding: 6px 2px; white-space: nowrap; }
.del.confirm { color: var(--on-accent); background: var(--accent); border-radius: 8px; padding: 6px 10px; }
.empty { padding: 24px 20px; text-align: center; color: var(--fg2); font-size: 15px; line-height: 1.45; }
.empty strong { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }

/* Pausen-Timer */
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc((66px + env(safe-area-inset-bottom, 0px)) * var(--z, 1));
  width: min(calc(520px * var(--z, 1)), calc(100% - 24px)); background: var(--card); border-radius: calc(20px * var(--z, 1)); box-shadow: 0 8px 30px rgba(0,0,0,.22);
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: calc(10px * var(--z, 1));
  padding: calc(14px * var(--z, 1)) calc(14px * var(--z, 1)) calc(16px * var(--z, 1)) calc(20px * var(--z, 1)); z-index: 20; overflow: hidden; }
.timer[hidden] { display: none; }
.timer .tl { font-size: calc(15px * var(--z, 1)); color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer .tv { font-size: calc(48px * var(--z, 1)); line-height: 1.05; font-weight: 700; letter-spacing: .01em; }
.timer.fin .tv { color: var(--green); }
.tbtn { height: calc(48px * var(--z, 1)); padding: 0 calc(16px * var(--z, 1)); border-radius: 999px; background: var(--fill); font-size: calc(17px * var(--z, 1)); font-weight: 600; white-space: nowrap; }
.tbar { position: absolute; left: 0; bottom: 0; height: calc(5px * var(--z, 1)); background: var(--accent); }

/* Tab Bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--sep); display: grid; grid-template-columns: 1fr 1fr; padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 30; }
.tab { display: grid; justify-items: center; gap: 2px; font-size: 10px; font-weight: 500; color: var(--fg2); padding: 2px 0; }
.tab svg { width: 26px; height: 26px; }
.tab.on { color: var(--accent); }

.toast { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--card); color: var(--fg);
  box-shadow: 0 6px 24px rgba(0,0,0,.18); border-radius: 999px; padding: 10px 18px; font-size: 15px; font-weight: 600; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
.statbtn { width: 40px; height: 36px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
.modal[hidden] { display: none; }
.msheet { background: var(--bg); color: var(--fg); width: 100%; max-width: 640px; max-height: 92%; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
.mhead { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; }
.mhead h2 { font-size: 22px; font-weight: 700; }
.mclose { width: 34px; height: 34px; border-radius: 999px; background: var(--fill); font-size: 16px; font-weight: 600; color: var(--fg2); }
.mbody { overflow-y: auto; padding: 0 16px 20px; -webkit-overflow-scrolling: touch; }
.mnote { font-size: 13px; color: var(--fg2); padding: 0 4px 6px; }
.sday { font-size: 13px; font-weight: 600; color: var(--fg2); text-transform: uppercase; letter-spacing: .04em; margin: 16px 4px 8px; }
.scard { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.shead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sname { font-weight: 600; font-size: 16px; }
.sval { font-size: 14px; color: var(--fg2); white-space: nowrap; }
.sval b { color: var(--fg); font-size: 17px; }
.sdelta.up { color: var(--green); }
.sdelta.down { color: var(--accent); }
.schart { width: 100%; height: auto; display: block; margin-top: 6px; }
.sl { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.sa { fill: var(--accent-soft); stroke: none; }
.sp { fill: var(--accent); }
.sx { font-size: 10px; fill: var(--fg2); }
.sempty { font-size: 14px; color: var(--fg3); margin-top: 4px; }
.plateau { margin-top: 8px; font-size: 13px; font-weight: 600; color: #E08600; background: rgba(255,149,0,.14); border-radius: 8px; padding: 6px 10px; }
.srow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 15px; padding: 8px 0 0; }
.srow + .srow { border-top: .5px solid var(--sep); margin-top: 8px; }
.sdelta { font-weight: 700; }
.sdim { color: var(--fg3); font-size: 13px; }
.chip.jump { background: var(--fill); color: var(--fg2); padding: 7px 12px; font-size: 13px; }
.chip.jump.on { background: var(--accent-soft); color: var(--accent); }
.stiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 12px; }
.stile { background: var(--card); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.stile b { font-size: 30px; font-weight: 700; line-height: 1.1; }
.stile span { font-size: 14px; font-weight: 600; }
.stile small { font-size: 12px; color: var(--fg3); }
/* Kein versehentliches Markieren (Google-Suchleiste) beim Tippen; Eingabefelder bleiben normal */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input { -webkit-user-select: text; user-select: text; }
button, input { touch-action: manipulation; }
/* Timer fängt keine Tipps ab (nur seine Buttons) und verschwindet beim Tippen in ein Feld */
.timer { pointer-events: none; }
.timer button { pointer-events: auto; }
body.typing .timer { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" id="app"></div>

<div class="timer" id="timer" hidden>
  <div><div class="tl" id="timerLabel">Pause</div><div class="tv" id="timerVal">0:00</div></div>
  <button class="tbtn" id="timerPlus" type="button">+15 s</button>
  <button class="tbtn" id="timerStop" type="button">Fertig</button>
  <div class="tbar" id="timerBar"></div>
</div>

<nav class="tabbar" aria-label="Bereiche">
  <button class="tab on" id="tabTrain" type="button">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11v6M24 11v6M7.5 8v12M20.5 8v12M7.5 14h13"/></svg>
    Training
  </button>
  <button class="tab" id="tabHist" type="button">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h20"/><path d="M5 18l5.5-6 4.5 3.5L23 7"/><path d="M18 7h5v5"/></svg>
    Verlauf
  </button>
</nav>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="statsModal" hidden><div class="msheet" role="dialog" aria-label="Statistik"><div class="mhead"><h2>Statistik</h2><button type="button" class="mclose" id="statsClose" aria-label="Schließen">✕</button></div><div class="mbody" id="statsBody"></div></div></div>

<script>
// ---------- Plan ----------
// unit: "kg" Gewicht, "kg+" Zusatzgewicht, "cm" Fußhöhe, null = nur Wiederholungen
const PLAN = {
  mo: { name: "Montag", focus: "Power & Beine", ex: [
    { id: "powerclean", bar: 20, name: "Power Cleans", sets: 3, min: 3, max: 3, rest: 120, unit: "kg", step: 2.5 },
    { id: "suitcase", name: "Einarmiger Farmer's Walk (Suitcase Carry)", sets: 2, min: 30, max: 40, rest: 45, unit: "kg", step: 2, repUnit: "s", tip: "Aufrecht gehen, nicht zur Seite lehnen. Zeit pro Seite, Gewicht so wählen, dass 30–40 s sauber gehen." } ]},
  di: { name: "Dienstag", focus: "Push & Trizeps", ex: [
    { id: "dbpress1", name: "Einarmiges KH-Drücken (halbknien)", sets: 3, min: 8, max: 12, rest: 60, unit: "kg", step: 2, start: 16, tip: "Halbknien (ein Knie am Boden, Becken aufrecht), Hantel auf Schulterhöhe, gerade nach oben drücken, Rippen unten lassen, kein Hohlkreuz. Wiederholungen pro Seite." },
    { id: "ohtriceps", name: "Überkopf-Trizepsdrücken (1 KH)", sets: 3, min: 10, max: 12, rest: 60, unit: "kg", step: 2 } ]},
  mi: { name: "Mittwoch", focus: "Pull & Bizeps", ex: [
    { id: "chinups", bw: "pull", assist: true, name: "Klimmzüge neutral (Ringe)", sets: 3, min: 8, max: 12, rest: 90, unit: "kg+", step: 2.5, tip: "Neutraler Griff, Handflächen zueinander. Mit Absprung hochkommen, oben kurz halten, langsam ablassen." },
    { id: "inclinecurl", name: "Schrägbank-Curls", sets: 2, min: 10, max: 12, rest: 60, unit: "kg", step: 1, tip: "Hände beim Hochgehen nach außen ausdrehen (Supination)." },
    { id: "pallof", bandOnly: true, name: "Pallof Press (Band)", sets: 2, min: 10, max: 12, rest: 30, unit: null, step: 0, tip: "Seitlich zum Band stehen, mit beiden Händen vor der Brust nach vorn drücken, 2 Sek. halten, der Körper darf sich nicht drehen. Wiederholungen pro Seite. Wenn 12 leicht gehen: stärkeres Band oder mehr Abstand zur Befestigung." } ]},
  do: { name: "Donnerstag", focus: "Beine & Core", ex: [
    { id: "frontsquat", bar: 20, name: "Front Squats", sets: 3, min: 5, max: 5, rest: 90, unit: "kg", step: 2.5 },
    { id: "kneeelbow", name: "Knee to Elbow (hängend)", sets: 2, min: 8, max: 12, rest: 60, unit: null, step: 0, tip: "Hängend, Knie kontrolliert zu den Ellbogen ziehen, ohne Schwung. Wenn 12 leicht gehen: langsamer oder Beine gestreckter." } ]},
  fr: { name: "Freitag", focus: "Quick-Push & Pull · unter 8 Min.", ex: [
    { id: "bbrow", bar: 20, name: "Langhantel-Rudern", sets: 3, min: 6, max: 8, rest: 45, unit: "kg", step: 2.5, ss: "Supersatz A1" },
    { id: "declinepushup", bw: "push", tempo: true, name: "Liegestütz mit Griffen, Füße erhöht", sets: 3, min: 6, max: 10, rest: 45, unit: "cm", step: 10, ss: "Supersatz A2",
      tip: "Füße auf Bank/Box (Start ca. 40 cm), neutraler Griff, Ellbogen 30–45° am Körper. 3 Sek. runter, 1–2 Sek. unten halten, kontrolliert hoch. Tiefe schrittweise steigern, ohne Ziehen vorn an der Schulter. Wenn zu leicht: langsamer oder Füße höher." } ]},
  sa: { name: "Samstag", focus: "Arm-Dicke & Schultern", ex: [
    { id: "hammercurl", name: "KH-Hammer-Curls", sets: 3, min: 10, max: 12, rest: 60, unit: "kg", step: 1, tip: "Hände durchgehend neutral (quer) halten." },
    { id: "lateralraise", name: "KH-Seitheben", sets: 2, min: 12, max: 15, rest: 60, unit: "kg", step: 1 },
    { id: "sideplank", name: "Seitstütz", sets: 2, min: 20, max: 40, rest: 30, unit: null, step: 0, repUnit: "s", tip: "Auf dem Unterarm, Körper in einer Linie. Zeit pro Seite." } ]}
};
const DAYS = ["mo","di","mi","do","fr","sa"];
const SHORT = { mo: "Mo", di: "Di", mi: "Mi", do: "Do", fr: "Fr", sa: "Sa" };
const UNIT_LABEL = { "kg": "kg", "kg+": "+kg", "cm": "cm" };
// Körpergewicht-Übungen: Last pro Wiederholung für die Statistik
const BODYWEIGHT = 90, JUMP_FACTOR = 0.6, TEMPO_FACTOR = 1.5, BAND_FACTOR = 0.3;
const BAND_NAMES = { 10: "grün", 20: "gelb", 30: "lila", 40: "rot" };
const ASSIST_OPTIONS = [{ k: "none", label: "Ohne Hilfe" }, { k: "jump", label: "Absprung" }, { k: "10", label: "Grün 10" }, { k: "20", label: "Gelb 20" }, { k: "30", label: "Lila 30" }, { k: "40", label: "Rot 40" }];
const assistCur = (dr) => dr.some(x => x.j) ? "jump" : (dr.find(x => x.b) ? String(dr.find(x => x.b).b) : "none");
function repLoad(ex, s, ext) {
  if (ex.bw === "pull") {
    const base = BODYWEIGHT + (+s.w || 0);
    if (s.b) return Math.max(0, base - s.b * BAND_FACTOR);
    if (s.j) return ext ? 0 : base * JUMP_FACTOR;
    return base;
  }
  if (ex.bw === "push") return BODYWEIGHT * (0.64 + 0.002 * (+s.w || 0)) * (s.t && !ext ? TEMPO_FACTOR : 1);
  return 0;
}

// ---------- Helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const fmt = (n) => n == null ? "" : n.toLocaleString("de-DE", { maximumFractionDigits: 2 });
const isoToday = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const deDate = (iso, withYear) => { const [y, m, d] = iso.split("-"); return `${d}.${m}.${withYear ? y : ""}`; };
const dayFromDate = (iso) => { const g = new Date(iso + "T12:00:00").getDay(); return g === 0 ? "mo" : DAYS[g - 1]; };
const lsGet = (k, f) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const isoOf = (x) => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
// Datum des gewählten Wochentags in der Woche des aktuell gewählten Datums; liegt es in der Zukunft, die Vorwoche
const dateForDay = (day, refIso) => {
  const ref = new Date(refIso + "T12:00:00");
  const g = ref.getDay(), monOff = g === 0 ? -6 : 1 - g;
  const d = new Date(ref); d.setDate(ref.getDate() + monOff + DAYS.indexOf(day));
  if (isoOf(d) > today) d.setDate(d.getDate() - 7);
  return isoOf(d);
};

// ---------- State ----------
let today = isoToday();
const state = {
  tab: "train",
  date: today,
  day: dayFromDate(today),
  sessions: [],          // [{id, date, day, entries:{exId:[{w,r}]}, savedAt}]
  why: "db wird geladen", mode: "local",         // "db" | "local"
  drafts: lsGet("kraftplan-drafts", {}),   // key `${date}_${day}` -> {exId:[{w,r,done}]}
  openEx: null, confirmDel: null, pendingRender: false
};

// ---------- Speicher ----------
let col = null;
const LS_SESS = "kraftplan-sessions";
function loadLocal() { state.sessions = lsGet(LS_SESS, []).sort((a, b) => b.date.localeCompare(a.date)); }
loadLocal();

async function initStore() {
  if (!window.claude || !window.claude.use) { state.why = "claude.use fehlt"; softRender(); return; }
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) { state.why = (!db ? "db nicht verfügbar" : "keine Nutzer-ID"); softRender(); return; }
    col = db.collection("data/users/" + uid);
    state.mode = "db"; state.why = "";
    col.orderBy("date", "desc").limit(400).onSnapshot(snap => {
      state.sessions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      // Entwürfe ohne Abweichung vom gespeicherten Stand verwerfen (der aktuell offene bleibt, solange ein Feld fokussiert ist)
      const editing = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains("num");
      for (const dk of Object.keys(state.drafts)) { if (editing && dk === draftKey()) continue; if (!draftTouched(state.drafts[dk]) || !draftDiffers(dk)) delete state.drafts[dk]; }
      saveDrafts();
      if (state.statsOpen) renderStats();
      softRender();
    }, (err) => { col = null; state.mode = "local"; state.why = "Konto-Speicher getrennt" + (err && err.code ? ": " + err.code : ""); loadLocal(); softRender(); });
    softRender();
  } catch (e) { state.why = "Fehler: " + ((e && (e.code || e.message)) || "unbekannt"); softRender(); }
}

async function writeSession(doc) {
  if (col) {
    const ref = col.doc(doc.id);
    try { await ref.set(doc); }
    catch (e) {
      if (!(e && e.code === "unavailable")) throw e;
      await new Promise(r => setTimeout(r, 600 + Math.random() * 600));
      await ref.set(doc);
    }
    let chk = null;
    try { chk = await ref.get(); } catch (e) { /* Kontroll-Lesen fehlgeschlagen: set() war erfolgreich */ }
    if (chk && !chk.exists) throw new Error("Dokument nach dem Speichern nicht lesbar");
    state.sessions = [doc, ...state.sessions.filter(s => s.id !== doc.id)].sort((a, b) => b.date.localeCompare(a.date));
    return;
  }
  const list = lsGet(LS_SESS, []).filter(s => s.id !== doc.id); list.push(doc); lsSet(LS_SESS, list);
  if (!lsGet(LS_SESS, []).some(s => s.id === doc.id)) throw new Error("Browser-Speicher nicht verfügbar");
  loadLocal();
}
async function deleteSession(id) {
  if (col) { await col.doc(id).delete(); return; }
  lsSet(LS_SESS, lsGet(LS_SESS, []).filter(s => s.id !== id)); loadLocal();
}

// ---------- Logik ----------
const draftKey = () => `${state.date}_${state.day}`;
// Entwurf -> Einträge im Speicherformat
function draftEntries(day, d) {
  const entries = {};
  for (const ex of (PLAN[day] ? PLAN[day].ex : [])) {
    const sets = ((d && d[ex.id]) || []).filter(s => s.r != null || s.w != null).map(s => ({ w: ex.unit ? s.w : null, r: s.r, ...(s.j ? { j: true } : {}), ...(s.t ? { t: true } : {}), ...(s.b ? { b: s.b } : {}) }));
    if (sets.length) entries[ex.id] = sets;
  }
  return entries;
}
const normEntries = (e) => JSON.stringify(Object.keys(e || {}).sort().map(k => [k, e[k].map(s => [s.w == null ? null : s.w, s.r == null ? null : s.r, s.j ? 1 : 0, s.t ? 1 : 0, s.b || 0])]));
const draftTouched = (d) => Object.keys(d).some(x => d[x].some(s => s.w != null || s.r != null || s.done));
// true, wenn der Entwurf vom gespeicherten Stand abweicht
function draftDiffers(key) {
  const d = state.drafts[key]; if (!d) return false;
  const day = key.slice(key.indexOf("_") + 1);
  const saved = state.sessions.find(s => s.id === key);
  return normEntries(draftEntries(day, d)) !== normEntries(saved ? saved.entries : {});
}
function draftFor(exId, n) {
  const k = draftKey(); state.drafts[k] = state.drafts[k] || {};
  if (!state.drafts[k][exId]) {
    const saved = state.sessions.find(s => s.id === k);
    const src = saved && saved.entries && saved.entries[exId];
    const le = lastEntry(exId, state.date), exd0 = PLAN[state.day].ex.find(x => x.id === exId) || {}, j0 = !!(le && le.sets.some(x => x.j)), b0 = (le && (le.sets.find(x => x.b) || {}).b) || 0, t0 = exd0.tempo ? true : !!(le && le.sets.some(x => x.t));
    state.drafts[k][exId] = Array.from({ length: n }, (_, i) => src && src[i] ? { w: src[i].w, r: src[i].r, j: !!src[i].j, t: !!src[i].t, b: src[i].b || 0, done: true } : { w: null, r: null, j: j0 && !b0, t: t0, b: b0, done: false });
  }
  return state.drafts[k][exId];
}
function lastEntry(exId, beforeDate) {
  for (const s of state.sessions) {
    if (s.date < beforeDate && s.entries && s.entries[exId] && s.entries[exId].some(x => x.r != null)) return { date: s.date, sets: s.entries[exId] };
  }
  return null;
}
function progression(ex, last) {
  if (!last) return null;
  const sets = last.sets.filter(s => s.r != null);
  const topW = Math.max(...sets.map(s => s.w ?? 0));
  const allTop = sets.length >= ex.sets && sets.every(s => s.r >= ex.max);
  const anyLow = sets.some(s => s.r < ex.min);
  if (allTop) {
    if (!ex.unit) return { type: "up", text: ex.repUnit ? "Ziel erreicht: länger halten" : "Ziel erreicht: langsamer oder +2 Wdh.", next: null };
    if (ex.unit === "cm") return { type: "up", text: `Steigern: Füße +${ex.step} cm`, next: topW + ex.step };
    return { type: "up", text: `Steigern: +${fmt(ex.step)} kg`, next: topW + ex.step };
  }
  if (anyLow) return { type: "hold", text: "Unter Zielbereich: Last halten", next: topW || null };
  return { type: "hold", text: `Last halten, Ziel ${ex.max} Wdh. pro Satz`, next: topW || null };
}
function setsText(ex, sets) {
  return sets.filter(s => s.r != null || s.w != null).map(s => {
    if (!ex.unit) return `${s.r ?? "–"}${ex.repUnit || ""}`;
    const w = s.w == null ? "–" : fmt(s.w + (ex.bar || 0)) + (ex.unit === "cm" ? " cm" : ex.unit === "kg+" ? " kg+" : "");
    return `${w}×${s.r ?? "–"}${ex.repUnit || ""}`;
  }).join(" · ") + (sets.some(s => s.j) ? " · mit Absprung" : "") + (sets.some(s => s.b) ? " · Band " + (BAND_NAMES[sets.find(s => s.b).b] || sets.find(s => s.b).b + " kg") : "") + (sets.some(s => s.t) ? " · mit Haltezeit" : "");
}

// ---------- Render ----------
function softRender() {
  const a = document.activeElement;
  const busy = Date.now() - (state.lastTouch || 0) < 4000;
  if (state.tab === "train" && ((a && a.classList && a.classList.contains("num")) || busy)) {
    state.pendingRender = true; clearTimeout(state.pendingT); state.pendingT = setTimeout(flushPending, 1500); return;
  }
  render();
}
function flushPending() {
  if (!state.pendingRender) return;
  const a = document.activeElement;
  if ((a && a.classList && a.classList.contains("num")) || Date.now() - (state.lastTouch || 0) < 3500) { state.pendingT = setTimeout(flushPending, 1500); return; }
  state.pendingRender = false; render();
}
document.addEventListener("pointerdown", (e) => { state.lastTouch = Date.now(); if (!(e.target.closest && e.target.closest(".tabbar"))) state.lastOtherDown = Date.now(); }, true);
document.addEventListener("focusout", () => setTimeout(flushPending, 400));

function header(title, sub) {
  const ok = state.mode === "db";
  return `<div class="topline">
    <span class="storage"><span class="dot ${ok ? "ok" : ""}"></span>${ok ? "In deinem Konto gespeichert" : state.why === "db wird geladen" ? "Verbinde mit Konto …" : "Nur in diesem Browser" + (state.why ? " (" + esc(state.why) + ")" : "")}</span>
    <span class="tools">
      ${state.tab === "train" ? `<button type="button" class="statbtn" id="statsBtn" aria-label="Statistik"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg></button><input type="date" class="datepick" id="datePick" value="${state.date}" aria-label="Datum">` : ""}
      <span class="sizer"><button type="button" id="zoomOut" aria-label="Kleiner" ${zoomIdx === 0 ? "disabled" : ""}>A</button><button type="button" id="zoomIn" aria-label="Größer" ${zoomIdx === ZOOMS.length - 1 ? "disabled" : ""}>A</button></span>
    </span>
  </div>
  <h1 class="largetitle">${esc(title)}</h1><p class="subtitle">${esc(sub)}</p>`;
}

function renderTrain() {
  const d = PLAN[state.day];
  const todayDay = dayFromDate(today);
  let h = header(d.name, d.focus);
  h += `<div class="seg" role="tablist">${DAYS.map(k => `<button type="button" role="tab" data-day="${k}" class="${k === state.day ? "on" : ""} ${k === todayDay ? "today" : ""}" aria-selected="${k === state.day}">${SHORT[k]}</button>`).join("")}</div>`;
  for (const ex of d.ex) {
    const dr = draftFor(ex.id, ex.sets);
    const last = lastEntry(ex.id, state.date);
    const pr = progression(ex, last);
    const range = ex.min === ex.max ? `${ex.min}` : `${ex.min}–${ex.max}`;
    h += `<div class="group-h"><span>${esc(ex.ss || "Übung")}</span><span>${ex.rest} s Pause</span></div>
    <section class="card">
      <div class="ex-head">
        <div class="ex-title"><span class="ex-name">${esc(ex.name)}</span><span class="ex-target">${ex.sets} × ${range}${ex.repUnit ? " " + ex.repUnit : ""}</span></div>
        ${pr || ex.ss ? `<div class="chips">${ex.ss ? `<span class="chip ss">${esc(ex.ss)}</span>` : ""}${pr ? `<span class="chip ${pr.type}">${esc(pr.text)}</span>` : ""}</div>` : ""}
        ${ex.assist || ex.bandOnly ? `<div class="chips">${ASSIST_OPTIONS.filter(o => ex.assist || o.k !== "jump").map(o => `<button type="button" class="chip jump ${assistCur(dr) === o.k ? "on" : ""}" data-assist="${ex.id}" data-mode="${o.k}" aria-pressed="${assistCur(dr) === o.k}">${assistCur(dr) === o.k ? "✓ " : ""}${ex.bandOnly && o.k === "none" ? "Kein Band" : o.label}</button>`).join("")}</div>` : ""}
        ${ex.tempo ? `<div class="chips"><button type="button" class="chip jump ${dr.some(s => s.t) ? "on" : ""}" data-tempo="${ex.id}" aria-pressed="${dr.some(s => s.t)}">${dr.some(s => s.t) ? "✓ " : ""}Langsam: 3 s runter, 1–2 s halten</button></div>` : ""}
        ${last ? `<div class="last">Zuletzt ${deDate(last.date)}: <b>${esc(setsText(ex, last.sets))}</b></div>` : ""}
        ${plateau(ex) ? plateauHtml() : ""}
        ${ex.tip ? `<div class="tip">${esc(ex.tip)}</div>` : ""}
        ${ex.bar ? `<div class="tip">Eingabe: nur Scheiben. Die Stange (${ex.bar} kg) wird in „Zuletzt“, Verlauf und Statistik automatisch addiert.</div>` : ""}
      </div>
      <div class="sets">
        <div class="row lbl"><span>Satz</span><span style="text-align:center">${ex.unit ? (ex.bar ? "kg Scheiben" : UNIT_LABEL[ex.unit]) : ""}</span><span style="text-align:center">${ex.repUnit === "s" ? "Sek." : "Wdh."}</span><span></span></div>
        ${dr.map((s, i) => {
          const lastSet = last && (last.sets[i] || last.sets[last.sets.length - 1]);
          const phW = pr && pr.type === "up" && pr.next != null ? fmt(pr.next) : lastSet && lastSet.w != null ? fmt(lastSet.w) : (ex.start != null ? String(ex.start) : ex.unit === "cm" ? "40" : ex.unit === "kg+" ? "0" : "");
          const phR = lastSet && lastSet.r != null ? lastSet.r : ex.max;
          return `<div class="row ${s.done ? "isdone" : ""}">
            <span class="setno">${i + 1}</span>
            ${ex.unit ? `<input class="num" id="w-${ex.id}-${i}" data-ex="${ex.id}" data-i="${i}" data-f="w" inputmode="decimal" placeholder="${phW}" value="${s.w == null ? "" : fmt(s.w)}" aria-label="Satz ${i + 1} ${UNIT_LABEL[ex.unit]}">` : `<input class="num" disabled value="–" aria-hidden="true" tabindex="-1">`}
            <input class="num" id="r-${ex.id}-${i}" data-ex="${ex.id}" data-i="${i}" data-f="r" inputmode="numeric" placeholder="${phR}" value="${s.r == null ? "" : s.r}" aria-label="Satz ${i + 1} Wiederholungen">
            <button type="button" class="check ${s.done ? "done" : ""}" data-check="${ex.id}" data-i="${i}" data-phw="${phW}" data-phr="${phR}" aria-label="Satz ${i + 1} erledigt" aria-pressed="${s.done}">
              <svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>
            </button>
          </div>`; }).join("")}
      </div>
    </section>`;
  }
  const saved = state.sessions.find(s => s.id === draftKey());
  h += `<div class="savebar"><button class="btn" id="saveBtn" type="button">${saved ? "Änderungen speichern" : "Training speichern"}</button>
    <div class="hint">${unsavedChanges() ? "⚠ Noch nicht gespeichert. Tippe auf den Speichern-Button." : saved ? `Gespeichert am ${deDate(state.date, true)} · erneutes Speichern überschreibt` : "Haken übernehmen den Vorschlag und starten die Pause. Gespeichert wird erst mit dem Button."}</div></div>`;
  return h;
}

function spark(ex, entries) {
  const pts = entries.slice(0, 12).reverse().map(e => {
    const s = e.sets.filter(x => x.r != null);
    return ex.unit ? Math.max(...s.map(x => x.w ?? 0)) : s.reduce((a, x) => a + x.r, 0);
  });
  if (pts.length < 2) return "";
  const W = 72, H = 28, p = 3, lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;
  const xy = pts.map((v, i) => [p + i * (W - 2 * p) / (pts.length - 1), H - p - (v - lo) / span * (H - 2 * p)]);
  const line = xy.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");
  const area = line + ` L${xy[xy.length - 1][0].toFixed(1)} ${H} L${xy[0][0].toFixed(1)} ${H} Z`;
  const e = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${area}" fill="var(--accent-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${e[0]}" cy="${e[1]}" r="2.6" fill="var(--accent)"/></svg>`;
}

function renderHist() {
  let h = header("Verlauf", `${state.sessions.length} gespeicherte ${state.sessions.length === 1 ? "Einheit" : "Einheiten"}`);
  if (!state.sessions.length) {
    return h + `<section class="card"><div class="empty"><strong>Noch keine Einheiten</strong>Trag im Tab „Training“ deine Sätze ein und tippe auf „Training speichern“. Hier siehst du danach pro Übung den Verlauf und die Entwicklung der Last.</div></section>`;
  }
  for (const k of DAYS) {
    const d = PLAN[k];
    h += `<div class="group-h"><span>${d.name} · ${esc(d.focus.split(" · ")[0])}</span></div><section class="card">`;
    for (const ex of d.ex) {
      const entries = state.sessions.filter(s => s.entries && s.entries[ex.id] && s.entries[ex.id].some(x => x.r != null)).map(s => ({ date: s.date, sets: s.entries[ex.id] }));
      const open = state.openEx === ex.id;
      const sub = entries.length ? `${deDate(entries[0].date)}: ${setsText(ex, entries[0].sets)}` : "Noch kein Eintrag";
      h += `<button type="button" class="li ${open ? "open" : ""}" data-open="${ex.id}" aria-expanded="${open}">
        <span class="li-main"><span class="li-title">${esc(ex.name)}</span><div class="li-sub">${esc(sub)}</div></span>
        <span class="li-right">${spark(ex, entries)}<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l5 5-5 5"/></svg></span>
      </button>`;
      if (open) {
        h += `<div class="detail">${entries.length ? entries.slice(0, 15).map(e => `<div class="drow"><span>${deDate(e.date, true)}</span><span>${esc(setsText(ex, e.sets))}</span></div>`).join("") : `<div class="drow"><span>Noch keine Daten</span><span></span></div>`}</div>`;
      }
    }
    h += `</section>`;
  }
  h += `<div class="group-h"><span>Einheiten</span></div><section class="card">`;
  for (const s of state.sessions.slice(0, 40)) {
    const n = Object.values(s.entries || {}).reduce((a, sets) => a + sets.filter(x => x.r != null).length, 0);
    const conf = state.confirmDel === s.id;
    h += `<div class="li"><span class="li-main"><span class="li-title">${PLAN[s.day] ? PLAN[s.day].name : s.day}, ${deDate(s.date, true)}</span><div class="li-sub">${n} Sätze</div></span>
      <button type="button" class="del ${conf ? "confirm" : ""}" data-del="${s.id}">${conf ? "Wirklich löschen" : "Löschen"}</button></div>`;
  }
  return h + `</section>`;
}

function render() {
  $("#app").innerHTML = state.tab === "train" ? renderTrain() : renderHist();
  $("#tabTrain").classList.toggle("on", state.tab === "train");
  $("#tabHist").classList.toggle("on", state.tab === "hist");
}

// ---------- Events ----------
const saveDrafts = () => lsSet("kraftplan-drafts", state.drafts);
$("#app").addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.ex) {
    const exd = PLAN[state.day].ex.find(x => x.id === t.dataset.ex); if (!exd) return;
    const s = draftFor(exd.id, exd.sets)[+t.dataset.i]; if (!s) return;
    s[t.dataset.f] = t.dataset.f === "r" ? (num(t.value) == null ? null : Math.round(num(t.value))) : num(t.value);
    saveDrafts();
  }
});
$("#app").addEventListener("change", (e) => {
  if (e.target.id === "datePick" && e.target.value) {
    state.date = e.target.value; state.day = dayFromDate(state.date); render();
  }
});
$("#app").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.day) { state.day = b.dataset.day; state.date = dateForDay(state.day, today); render(); window.scrollTo({ top: 0 }); return; }
  if (b.dataset.assist) {
    const exa = PLAN[state.day].ex.find(x => x.id === b.dataset.assist); if (!exa) return;
    const dra = draftFor(exa.id, exa.sets), mode = b.dataset.mode;
    dra.forEach(x => { x.j = mode === "jump"; x.b = /^\d+$/.test(mode) ? +mode : 0; });
    saveDrafts(); render(); return;
  }
  if (b.dataset.tempo) {
    const ext = PLAN[state.day].ex.find(x => x.id === b.dataset.tempo); if (!ext) return;
    const drt = draftFor(ext.id, ext.sets), on = !drt.some(s => s.t);
    drt.forEach(s => { s.t = on; }); saveDrafts(); render(); return;
  }
  if (b.dataset.check) {
    const ex = PLAN[state.day].ex.find(x => x.id === b.dataset.check);
    const s = draftFor(ex.id, ex.sets)[+b.dataset.i]; if (!s) return;
    s.done = !s.done;
    if (s.done) {
      if (s.w == null && ex.unit) s.w = num(b.dataset.phw);
      if (s.r == null) s.r = num(b.dataset.phr);
      startTimer(ex.rest, ex.name);
    }
    saveDrafts(); render(); return;
  }
  if (b.id === "statsBtn") { openStats(); return; }
  if (b.id === "saveBtn") { await save(); return; }
  if (b.id === "zoomIn" || b.id === "zoomOut") { setZoom(zoomIdx + (b.id === "zoomIn" ? 1 : -1)); return; }
  if (b.dataset.open) { state.openEx = state.openEx === b.dataset.open ? null : b.dataset.open; render(); return; }
  if (b.dataset.del) {
    if (state.confirmDel !== b.dataset.del) { state.confirmDel = b.dataset.del; render(); return; }
    state.confirmDel = null;
    try { await deleteSession(b.dataset.del); toast("Einheit gelöscht"); } catch (err) { toast("Löschen fehlgeschlagen. Bitte erneut versuchen."); }
    render(); return;
  }
});

function unsavedChanges() {
  if (state.tab !== "train") return false;
  return draftDiffers(draftKey());
}

async function save() {
  state.tabLock = Date.now() + 5000;
  const k = draftKey();
  const entries = draftEntries(state.day, state.drafts[k]);
  if (!Object.keys(entries).length) { state.tabLock = 0; toast("Trag mindestens einen Satz ein"); return; }
  const doc = { id: k, date: state.date, day: state.day, entries, savedAt: new Date().toISOString() };
  try {
    await writeSession(doc);
    delete state.drafts[k]; saveDrafts();
    toast("✓ Training gespeichert", 3500);
  } catch (err) {
    toast(err && err.code === "quota_exceeded" ? "Speicher voll. Lösche alte Einheiten im Verlauf." : "Speichern fehlgeschlagen: " + ((err && (err.code || err.message)) || "unbekannt") + ". Deine Eingaben bleiben erhalten.", 5000);
  }
  state.tabLock = Date.now() + 1500;
  state.tab = "train";
  render();
}

let tabDown = { id: "", t: 0 };
document.querySelector(".tabbar").addEventListener("pointerdown", (e) => { const b = e.target.closest("button"); tabDown = { id: b ? b.id : "", t: Date.now() }; });
const tabTapOk = (id) => tabDown.id === id && Date.now() - tabDown.t < 1500;
$("#tabTrain").addEventListener("click", (e) => { if (e.detail !== 0 && (!tabTapOk("tabTrain") || Date.now() - (state.lastOtherDown || 0) < 2500)) return; if (Date.now() < (state.tabLock || 0)) return; state.tab = "train"; render(); window.scrollTo({ top: 0 }); });
$("#tabHist").addEventListener("click", (e) => { if (e.detail !== 0 && (!tabTapOk("tabHist") || Date.now() - (state.lastOtherDown || 0) < 2500)) return; if (Date.now() < (state.tabLock || 0)) return; if (unsavedChanges() && !(Date.now() < (state.warnUntil || 0))) { state.warnUntil = Date.now() + 5000; toast("Noch nicht gespeichert! Tippe auf \"Training speichern\". Zum Wechseln nochmal tippen.", 4500); return; } state.tab = "hist"; state.confirmDel = null; render(); window.scrollTo({ top: 0 }); });

// ---------- Statistik (Volumen) ----------
const fmtD = (d) => { const a = d.split("-"); return (+a[2]) + "." + (+a[1]) + "."; };
const fmtN = (n) => (Math.round(n * 10) / 10).toLocaleString("de-DE");
function statSeries(ex) {
  const pts = [];
  for (const s of state.sessions) {
    const sets = s.entries && s.entries[ex.id]; if (!sets || !sets.length) continue;
    let vol = 0, reps = 0, hasW = false, best = 0;
    for (const x of sets) {
      const r = +x.r || 0; reps += r;
      const ld = ex.bw ? repLoad(ex, x, true) : (x.w == null ? 0 : (+x.w || 0) + (ex.bar || 0));
      if (r > 0 && ld > 0) best = Math.max(best, ld * (1 + r / 30));
      if (ex.bandOnly) { const bl = (x.b || 0) * BAND_FACTOR; vol += r * bl; if (r > 0 && bl > 0) hasW = true; continue; }
      if (ex.bw) { vol += r * repLoad(ex, x); if (r > 0) hasW = true; continue; }
      const w = x.w == null ? 0 : (+x.w || 0) + (ex.bar || 0); vol += w * r; if (w > 0) hasW = true;
    }
    if (ex.bw && reps === 0) continue;
    pts.push({ date: s.date, vol, reps, hasW, best });
  }
  pts.sort((a, b) => a.date.localeCompare(b.date));
  const eOk = (ex.bw || ex.unit === "kg" || ex.unit === "kg+") && !ex.repUnit;
  const useVol = (ex.bw || ex.bandOnly || ex.unit === "kg" || ex.unit === "kg+") && pts.length > 0 && pts.every(p => p.hasW);
  return { unit: useVol ? (ex.repUnit ? "kg·" + ex.repUnit : "kg") : (ex.repUnit === "s" ? "Sek." : "Wdh."), pts: pts.map(p => ({ date: p.date, v: useVol ? p.vol : p.reps, e: eOk && p.best > 0 ? p.best : null })), eOk };
}
function statChart(pts) {
  const W = 320, H = 104, pl = 14, pr = 14, pt = 14, pb = 22, n = pts.length;
  const hi = Math.max(...pts.map(p => p.v)) * 1.1 || 1;
  const X = (i) => n === 1 ? W / 2 : pl + i * (W - pl - pr) / (n - 1);
  const Y = (v) => H - pb - (v / hi) * (H - pb - pt);
  const xy = pts.map((p, i) => [X(i), Y(p.v)]);
  const line = xy.map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1)).join(" ");
  const area = n > 1 ? `<path class="sa" d="${line} L${xy[n - 1][0].toFixed(1)} ${H - pb} L${xy[0][0].toFixed(1)} ${H - pb} Z"/>` : "";
  const dots = xy.map(c => `<circle class="sp" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5"/>`).join("");
  const lab = n > 1
    ? `<text class="sx" x="${pl}" y="${H - 6}">${fmtD(pts[0].date)}</text><text class="sx" x="${W - pr}" y="${H - 6}" text-anchor="end">${fmtD(pts[n - 1].date)}</text>`
    : `<text class="sx" x="${W / 2}" y="${H - 6}" text-anchor="middle">${fmtD(pts[0].date)}</text>`;
  return `<svg class="schart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">${area}${n > 1 ? `<path class="sl" d="${line}"/>` : ""}${dots}${lab}</svg>`;
}
function plateau(ex) {
  const pts = statSeries(ex).pts; if (pts.length < 3) return false;
  const l = pts.slice(-3);
  const volFlat = l[0].v > 0 && Math.max(l[1].v, l[2].v) <= l[0].v * 1.02;
  const pe = pts.filter(q => q.e != null).slice(-3);
  const eFlat = pe.length < 3 || Math.max(pe[1].e, pe[2].e) <= pe[0].e * 1.02;
  return volFlat && eFlat;
}
function plateauHtml() { return '<div class="plateau">⚠ Plateau: seit 3 Einheiten kein Fortschritt bei Volumen und Kraft</div>'; }
function weekStart(iso) {
  const d = new Date(iso + "T12:00:00"); const g = d.getDay();
  d.setDate(d.getDate() + (g === 0 ? -6 : 1 - g));
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function prevWeek(ws) {
  const d = new Date(ws + "T12:00:00"); d.setDate(d.getDate() - 7);
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
const pct = (a, b) => b > 0 ? Math.round((a - b) / b * 100) : null;
function pctRow(label, p, note) {
  if (p == null) return `<div class="srow"><span>${label}</span><span class="sdim">${note}</span></div>`;
  return `<div class="srow"><span>${label}</span><span class="sdelta ${p >= 0 ? "up" : "down"}">${p >= 0 ? "+" : ""}${p} %</span></div>`;
}
function renderStats() {
  const wkSet = new Set(); let firstDate = null;
  for (const sx of state.sessions) {
    if (!Object.values(sx.entries || {}).some(a => a.some(x => x.r != null))) continue;
    wkSet.add(weekStart(sx.date)); if (!firstDate || sx.date < firstDate) firstDate = sx.date;
  }
  const planWeeks = firstDate ? Math.max(1, Math.round((new Date(weekStart(today) + "T12:00:00") - new Date(weekStart(firstDate) + "T12:00:00")) / 604800000) + 1) : 0;
  let html = `<div class="stiles"><div class="stile"><b>${wkSet.size}</b><span>Wochen trainiert</span><small>Wochen mit mindestens einer Einheit</small></div><div class="stile"><b>${planWeeks}</b><span>Wochen mit diesem Plan</span><small>${firstDate ? "seit " + deDate(firstDate, true) : "noch nicht gestartet"}</small></div></div>`;
  html += `<p class="mnote">Volumen = Gewicht × Wiederholungen aller Sätze. Übungen ohne Gewicht zeigen die Wiederholungen. Klimmzüge und Liegestütze sind mit Körpergewicht (${BODYWEIGHT} kg) gerechnet: Klimmzüge mit Absprung zählen ${Math.round(JUMP_FACTOR * 100)} %, mit Band werden ${Math.round(BAND_FACTOR * 100)} % des Band-Werts vom Körpergewicht abgezogen (beim Pallof Press zählen sie als Last), Liegestütze 64 % des Körpergewichts plus 0,2 % je cm Fußhöhe, bei langsamem Tempo mit Haltezeit ${String(TEMPO_FACTOR).replace(".", ",")}-fach. „Gesamt“ vergleicht deine letzte Einheit mit der ersten, „Vorwoche“ mit der Einheit der Woche davor. Kraft = geschätztes Maximalgewicht für eine Wiederholung (Epley-Formel) aus deinem besten Satz. Sie steigt, wenn du schwerer trainierst, auch wenn die Wiederholungen sinken und das Volumen dadurch fällt. Sätze mit Absprung und die Haltezeit bei Liegestützen fließen in die Kraft nicht ein, nur das tatsächlich bewegte Gewicht.</p>`;
  for (const dk of DAYS) {
    const d = PLAN[dk];
    html += `<h3 class="sday">${esc(d.name)} · ${esc(d.focus)}</h3>`;
    for (const ex of d.ex) {
      const st = statSeries(ex), pts = st.pts;
      html += `<div class="scard"><div class="shead"><span class="sname">${esc(ex.name)}</span>`;
      if (pts.length) {
        const first = pts[0], last = pts[pts.length - 1];
        const total = pts.length > 1 ? pct(last.v, first.v) : null;
        const pw = prevWeek(weekStart(last.date));
        const prev = pts.filter(q => weekStart(q.date) === pw).pop();
        const week = prev ? pct(last.v, prev.v) : null;
        const ptsE = pts.filter(q => q.e != null);
        const lastE = ptsE[ptsE.length - 1], firstE = ptsE[0];
        const eTotal = ptsE.length > 1 ? pct(lastE.e, firstE.e) : null;
        const prevE = lastE ? ptsE.filter(q => weekStart(q.date) === prevWeek(weekStart(lastE.date))).pop() : null;
        const eWeek = prevE ? pct(lastE.e, prevE.e) : null;
        html += `<span class="sval"><b>${fmtN(last.v)}</b> ${st.unit}</span></div>${plateau(ex) ? plateauHtml() : ""}`
          + pctRow("Volumen: gesamt seit Start", total, pts.length > 1 ? "–" : "erst ab 2 Einheiten")
          + pctRow("Volumen: zur Vorwoche", week, "keine Einheit in der Vorwoche")
          + (lastE ? `<div class="srow"><span>Geschätzte Maximalkraft</span><span><b>${fmtN(lastE.e)}</b> kg${lastE !== last ? ` <span class="sdim">(${fmtD(lastE.date)})</span>` : ""}</span></div>`
            + pctRow("Kraft: gesamt seit Start", eTotal, "erst ab 2 Messungen")
            + pctRow("Kraft: zur Vorwoche", eWeek, "keine Messung in der Vorwoche")
            : (st.eOk ? `<div class="srow"><span>Kraft</span><span class="sdim">nicht messbar (nur mit Absprung)</span></div>` : ""));
      } else {
        html += `</div><div class="sempty">Noch keine Daten</div>`;
      }
      html += `</div>`;
    }
  }
  $("#statsBody").innerHTML = html;
}
function openStats() { state.statsOpen = true; renderStats(); $("#statsModal").hidden = false; document.body.style.overflow = "hidden"; }
function closeStats() { state.statsOpen = false; $("#statsModal").hidden = true; document.body.style.overflow = ""; }
$("#statsModal").addEventListener("click", (e) => { if (e.target.id === "statsModal" || e.target.closest("#statsClose")) closeStats(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.statsOpen) closeStats(); });

// ---------- Größe (App-Zoom statt Browser-Zoom) ----------
const ZOOMS = [0.9, 1, 1.15, 1.3, 1.5, 1.75, 2];
let zoomIdx = (() => { const s = lsGet("kraftplan-zoom", null); if (s != null && ZOOMS[s] != null) return s; return window.innerWidth >= 900 ? 3 : 1; })();
function applyZoom() { document.documentElement.style.setProperty("--z", ZOOMS[zoomIdx]); }
function setZoom(i) { zoomIdx = Math.max(0, Math.min(ZOOMS.length - 1, i)); lsSet("kraftplan-zoom", zoomIdx); applyZoom(); render(); }
applyZoom();

// ---------- Timer bleibt auch beim Reinzoomen (Pinch) sichtbar ----------
function placeTimer() {
  const t = $("#timer"), vv = window.visualViewport;
  if (t.hidden || !vv || Math.abs(vv.scale - 1) < 0.02) { t.style.left = t.style.top = t.style.bottom = t.style.transform = t.style.transformOrigin = ""; return; }
  const s = 1 / vv.scale;
  t.style.transformOrigin = "0 0";
  t.style.left = (vv.offsetLeft + vv.width / 2) + "px";
  t.style.top = (vv.offsetTop + vv.height - 12 * s) + "px";
  t.style.bottom = "auto";
  t.style.transform = `scale(${s}) translate(-50%, -100%)`;
}
if (window.visualViewport) { visualViewport.addEventListener("resize", placeTimer); visualViewport.addEventListener("scroll", placeTimer); }

// ---------- Timer ----------
let tEnd = 0, tTotal = 0, tInt = null, tHide = null;
function startTimer(sec, label) {
  clearTimeout(tHide); tTotal = sec; tEnd = Date.now() + sec * 1000;
  $("#timerLabel").textContent = "Pause · " + label; $("#timer").classList.remove("fin"); $("#timer").hidden = false; placeTimer();
  clearInterval(tInt); tInt = setInterval(tick, 250); tick();
}
function tick() {
  const left = Math.max(0, Math.ceil((tEnd - Date.now()) / 1000));
  $("#timerVal").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  $("#timerBar").style.width = (100 * left / tTotal) + "%";
  if (left === 0) { clearInterval(tInt); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (_) {} $("#timer").classList.add("fin"); $("#timerVal").textContent = "Weiter!"; tHide = setTimeout(() => $("#timer").hidden = true, 4000); }
}
$("#timerPlus").addEventListener("click", () => { if ($("#timer").classList.contains("fin")) return startTimer(15, $("#timerLabel").textContent.replace("Pause · ", "")); tEnd += 15000; tTotal += 15; tick(); });
$("#timerStop").addEventListener("click", () => { clearInterval(tInt); clearTimeout(tHide); $("#timer").hidden = true; });

let toastT = null;
function toast(msg, ms) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms || 2200); }

window.addEventListener("error", (e) => { try { toast("Fehler: " + (e.message || "unbekannt"), 5000); } catch (_) {} });
window.addEventListener("unhandledrejection", (e) => { try { toast("Fehler: " + ((e.reason && (e.reason.message || e.reason.code)) || "unbekannt"), 5000); } catch (_) {} });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  const t = isoToday(); if (t === today || unsavedChanges()) return;
  today = t; state.date = t; state.day = dayFromDate(t); render();
});

document.addEventListener("focusin", (e) => { if (e.target.classList && e.target.classList.contains("num")) document.body.classList.add("typing"); });
document.addEventListener("focusout", () => setTimeout(() => { const a = document.activeElement; if (!(a && a.classList && a.classList.contains("num"))) document.body.classList.remove("typing"); }, 300));

render();
initStore();
</script>
